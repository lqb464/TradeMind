name: ML workflow
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ml-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src scripts app.py
      - run: python -m pytest
