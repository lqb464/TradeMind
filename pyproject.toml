[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trademind-ml"
version = "4.0.0"
description = "Python-first ML research workspace for financial time series and NLP"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "yfinance>=0.2.54,<2",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]
notebooks = ["jupyter>=1,<2", "matplotlib>=3.9,<4", "seaborn>=0.13,<1", "plotly>=5,<7"]
nlp = ["sentence-transformers>=3.3,<6", "transformers>=4.47,<6", "datasets>=3.2,<5", "accelerate>=1.2,<3", "torch>=2.4,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
