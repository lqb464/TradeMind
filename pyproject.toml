[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TradeMind"
version = "3.0.0"
description = "Safety-first intelligent trading research and paper-execution agent"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "yfinance>=0.2.54,<2",
    "pypdf>=5,<7",
    "python-multipart>=0.0.12,<1",
    "redis>=5.2,<8",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "black>=24,<27",
    "ruff>=0.9,<1",
]
notebooks = [
    "jupyter>=1,<2",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "plotly>=5,<7",
]
training = [
    "sentence-transformers>=3.3,<6",
    "transformers>=4.47,<6",
    "datasets>=3.2,<5",
    "accelerate>=1.2,<3",
    "torch>=2.4,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "src*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
pythonpath = ["."]
# Import tests as modules without prepending ``backend/`` to sys.path.  The
# project intentionally has both ``backend.src`` and the top-level ML package
# ``src``; pytest's legacy prepend mode can otherwise shadow ``src`` with
# ``backend/src`` when both suites run in one process.
addopts = "-q --tb=short --import-mode=importlib"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
